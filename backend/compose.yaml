services:
  db:
    image: postgres:17
    container_name: postgres17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bar"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: barbackend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9090:9090"

volumes:
  pgdata: {}
