<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>Cyberpunk Bar offline</title>
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background: #111318;
            color: #e2e2e9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            display: grid;
            place-items: center;
            padding:
                max(24px, env(safe-area-inset-top))
                max(24px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom))
                max(24px, env(safe-area-inset-left));
            box-sizing: border-box;
        }

        main {
            max-width: 420px;
            padding: 24px;
            border: 1px solid #3c3e45;
            border-radius: 20px;
            background: #1d2024;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<main>
    <h1>Нет подключения</h1>
    <p>Cyberpunk Bar откроет последнюю сохраненную версию, когда сеть вернется.</p>
</main>
</body>
</html>
